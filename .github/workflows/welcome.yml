name: post welcome commit
on:
  pull_request:
    types: [opened]
permissions: 
  pull-requests: write
jobs:
  welcome:
    name: post welcome commit
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR_URL" --body "welcome to repository"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
